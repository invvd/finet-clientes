services:
  db:
    image: postgres:15-alpine
    container_name: finet-clientes-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finet_clientes
    ports:
      - "5555:5432"
    volumes:
      - finet_clientes_db:/var/lib/postgresql/data
volumes:
  finet_clientes_db:
